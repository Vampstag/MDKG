        <style>
            /* Anti-Flicker Inline CSS */
            body.preloader-active { overflow: hidden; }
            #preloader { position: fixed; inset: 0; background-color: #000; color: #fff; z-index: 99999; display: flex; justify-content: center; align-items: center; flex-direction: column; transition: transform 0.8s cubic-bezier(0.19, 1, 0.22, 1); transform-origin: top; }
            #preloader.finished { transform: translateY(-100%); }
            .counter-wrapper { position: relative; text-align: center; transition: opacity 0.5s ease; }
            .counter-wrapper.fade-out { opacity: 0; }
            #counter { font-size: 15vw; font-weight: 700; letter-spacing: -0.04em; font-family: 'Inter', sans-serif; display: block; }
            .corner-text { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.6; font-family: 'Inter', sans-serif; }
            .top-corners, .bottom-corners { position: absolute; width: calc(100% - 60px); left: 30px; right: 30px; display: flex; justify-content: space-between; }
            .top-corners { top: 30px; } .bottom-corners { bottom: 40px; }
            .progress-track { position: absolute; bottom: 0; left: 0; width: 100%; height: 6px; background: #1a1a1a; }
            .progress-fill { height: 100%; width: 0%; background: #ffffff; transition: width 0.2s ease; }
            @media (max-width: 767px) { #counter { font-size: 20vw; } .corner-text { font-size: 9px; } .top-corners, .bottom-corners { width: calc(100% - 40px); left: 20px; right: 20px; } .top-corners { top: 20px; } .bottom-corners { bottom: 25px; } }

            /* ============================================================
               [NEW] Library page: 3-tab shell (Reading List / Watch List / Archive)
               Whole tabbed area is dark-themed per explicit request (black bg,
               white text) — this wraps the original gallery (now the
               Archive tab) plus two new empty tabs. Tab switching is pure JS
               show/hide (see the library-tabs script near the closing body tag);
               no page reload, hash-synced (#reading-list/#watch-list/#archive).
               ============================================================ */

            /* The whole page (not just .library-section) is black/white-on-black, so the
               shared .navbar (css/style.css) needs a permanent light-on-dark treatment here
               instead of its default "white text only while unscrolled, flips to dark navbar
               once .scrolled is added" behavior — that flip assumes a white page background
               below the fold, which this page never has. Reuses the same selectors
               .navbar-invert-top already defines (see css/style.css) but drops the
               :not(.scrolled) guard so it stays white regardless of scroll state, and
               overrides .scrolled's own forced white background back to black. */
            .navbar.library-invert {
                background-color: transparent !important;
            }
            .navbar.library-invert.scrolled {
                background-color: rgba(0,0,0,0.92) !important;
                border-bottom-color: rgba(255,255,255,0.08);
            }
            .navbar.library-invert .logo,
            .navbar.library-invert .w-nav-brand,
            .navbar.library-invert .nav-text,
            .navbar.library-invert .logo * {
                color: #ffffff !important;
            }
            .navbar.library-invert .logo img,
            .navbar.library-invert .logo svg,
            .navbar.library-invert .w-nav-brand img,
            .navbar.library-invert .w-nav-brand svg {
                filter: brightness(0) invert(1) !important;
            }
            .navbar.library-invert .navigation-link .line-below {
                background-color: #ffffff;
            }
            .navbar.library-invert .button-normal-black-wrapper-2 {
                background-color: transparent !important;
                border-color: rgba(255, 255, 255, 0.4) !important;
            }
            .navbar.library-invert .button-normal-black-wrapper-2:hover {
                background-color: #ffffff !important;
                border-color: #ffffff !important;
            }
            .navbar.library-invert .button-normal-black-wrapper-2 .button-normal-black-text-2 {
                color: #ffffff !important;
            }
            .navbar.library-invert .button-normal-black-wrapper-2:hover .button-normal-black-text-2 {
                color: #000000 !important;
            }
            .navbar.library-invert .button-normal-black-wrapper-2 img,
            .navbar.library-invert .button-normal-black-wrapper-2 svg {
                filter: brightness(0) invert(1) !important;
            }
            .navbar.library-invert .button-normal-black-wrapper-2:hover img,
            .navbar.library-invert .button-normal-black-wrapper-2:hover svg {
                filter: brightness(0) !important;
            }
            .navbar.library-invert .hamburger-line {
                background-color: #ffffff;
            }
            .library-section {
                background-color: #000;
                color: #fff;
                min-height: 100vh;
                padding-top: 140px;
                padding-bottom: 80px;
            }
            /* [NEW] Archive-index label — a small uppercase kicker above the heading,
               the kind of catalog/index marking you'd see on a physical archive box. */
            .library-index-label {
                font-family: var(--font-primary);
                font-size: 0.72rem;
                font-weight: 600;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: rgba(255,255,255,0.4);
                margin: 0 0 14px;
            }
            .library-heading {
                font-family: var(--font-primary);
                font-weight: 800;
                letter-spacing: -0.02em;
                font-size: clamp(1.8rem, 4vw, 2.6rem);
                margin: 0 0 8px;
                color: #fff;
            }
            .library-subheading {
                font-family: var(--font-primary);
                font-weight: 400;
                font-size: 0.95rem;
                color: rgba(255,255,255,0.55);
                margin: 0 0 32px;
                max-width: 46ch;
                padding-bottom: 32px;
                border-bottom: 1px solid rgba(255,255,255,0.1);
            }

            /* --- Tab switcher --- */
            .library-tabs {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
                border-bottom: 1px solid rgba(255,255,255,0.15);
                margin-bottom: 40px;
            }
            .library-tab-btn {
                font-family: var(--font-primary);
                font-size: 0.78rem;
                font-weight: 600;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: rgba(255,255,255,0.5);
                background: transparent;
                border: none;
                border-bottom: 2px solid transparent;
                padding: 12px 18px;
                margin-bottom: -1px;
                border-radius: 0; /* Squircle, not circle — matches the site's art direction */
                cursor: pointer;
                transition: color 0.2s ease, border-color 0.2s ease;
                white-space: nowrap;
            }
            .library-tab-btn:hover {
                color: #fff;
            }
            .library-tab-btn.is-active {
                color: #fff;
                border-bottom-color: #fff;
            }

            .library-panel {
                display: none;
            }
            .library-panel.is-active {
                display: block;
            }

            /* --- Empty-state note for not-yet-populated tabs --- */
            .library-empty-note {
                font-family: var(--font-primary);
                font-size: 0.85rem;
                color: rgba(255,255,255,0.4);
                padding: 60px 0;
                text-align: center;
                border: 1px dashed rgba(255,255,255,0.15);
            }

            /* [NEW] Category filter for Reading List / Watch List (SEE/THINK/MAKE/DIRECT/
               LEAD/CULTURE/REFERENCES) — a plain inline pill row, distinct from
               .library-filter-bar which is fixed-position and built for the Archive canvas. */
            .library-category-filter {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-bottom: 24px;
            }
            .library-category-btn {
                font-family: var(--font-primary);
                font-size: 0.7rem;
                font-weight: 600;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                color: rgba(255,255,255,0.55);
                background: transparent;
                border: 1px solid rgba(255,255,255,0.18);
                border-radius: 0;
                padding: 7px 14px;
                cursor: pointer;
                transition: all 0.2s ease;
                white-space: nowrap;
            }
            .library-category-btn:hover { color: #fff; border-color: rgba(255,255,255,0.4); }
            .library-category-btn.is-active { color: #000; background: #fff; border-color: #fff; }

            /* --- Reading List grid + card --- */
            .library-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 24px;
            }
            @media (min-width: 640px) {
                .library-grid { grid-template-columns: repeat(3, 1fr); gap: 28px; }
            }
            @media (min-width: 992px) {
                .library-grid { grid-template-columns: repeat(4, 1fr); gap: 32px; }
            }

            /* An <a>, like .watch-card: the whole card is the link, so there is no separate
               button to click. */
            .reading-card {
                display: flex;
                flex-direction: column;
                background-color: #0a0a0a;
                border-radius: 0; /* Squircle, not circle — matches the site's art direction */
                overflow: hidden;
                text-decoration: none;
                color: inherit;
            }
            /* Positioning context for the hover label and its scrim, and the clipping box for
               the cover's own hover scale. */
            .reading-card-media {
                position: relative;
                overflow: hidden;
            }
            .reading-card-media .reading-card-cover,
            .reading-card-media .reading-card-cover-placeholder {
                transition: transform 0.8s var(--ease-smooth);
            }
            .reading-card:hover .reading-card-cover {
                transform: scale(1.04);
            }
            /* object-fit is `contain`, not `cover`: these are real book covers from
               publishers and Open Library, whose proportions vary (roughly 2:3 to 3:4) and
               rarely match this card's 3/4 slot. Cropping them cut the title off the top or
               spine off the side — a book cover is a designed object, so it's shown whole,
               letterboxed against the card's own dark background. */
            /* Background matches .reading-card's own #0a0a0a rather than the #111 the watch
               card uses behind its thumbnails. A watch thumbnail is a photo that fills its
               frame, so the difference never shows; a book cover is letterboxed by
               object-fit:contain above, leaving that lighter field visible as a band across
               the top and bottom of the tile, which read as a border around the cover. */
            .reading-card-cover {
                width: 100%;
                aspect-ratio: 3/4;
                object-fit: contain;
                display: block;
                background-color: #0a0a0a;
            }
            /* [NEW] Generated cover for reading-list entries that link to an external
               article or essay rather than a book — there is no cover art to fetch, and the
               source pages mostly expose either no og:image or a generic site banner, which
               would read as noise rather than information.

               The tile carries the AUTHOR, and nothing else. The card body directly below
               already prints the category badge and the title, so setting either one here
               just said the same word twice on one card. The author is the only thing about
               the entry not otherwise visible at this size, which makes it the one honest
               subject for the slot — a title page, not a decorated box. */
            .reading-card-cover-placeholder {
                position: relative;
                width: 100%;
                /* Matches .reading-card-cover's 3/4 exactly. These tiles sit in the same rows
                   as real book covers, so a shorter slot pushed this card's badge and title
                   up while its neighbours' stayed at the bottom, leaving the row's baselines
                   ragged. The height is the price of that alignment. */
                aspect-ratio: 3/4;
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                justify-content: flex-end;
                gap: 14px;
                padding: 22px;
                box-sizing: border-box;
                background-color: #0a0a0a; /* Same as .reading-card, so the tile and the body
                    below it read as one surface with no seam between them. */
                overflow: hidden;
            }
            /* One hairline, aligned to the text's baseline grid. No pattern or gradient
               behind it: this sits in a grid of real book covers, and anything more
               decorative competed with them instead of sitting quietly between them. */
            .reading-card-cover-placeholder .placeholder-rule {
                width: 28px;
                height: 1px;
                background-color: rgba(255,255,255,0.28);
                flex: none;
            }
            /* 0.9rem, the same size as .reading-card-title. The author was set larger than
               the title it belongs to, which made the supporting credit the loudest thing on
               the card; matching the title keeps the tile quiet and puts the whole card on
               one type scale. */
            .reading-card-cover-placeholder .placeholder-author {
                font-family: var(--font-primary);
                font-size: 0.9rem;
                font-weight: 500;
                line-height: 1.3;
                letter-spacing: -0.01em;
                color: rgba(255,255,255,0.7);
                text-wrap: balance;
                /* Long institutional credits would otherwise fill the whole tile; cap them
                   so the composition stays bottom-weighted and consistent card to card. */
                display: -webkit-box;
                -webkit-line-clamp: 4;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }
            /* No flex:1 or gap any more: those existed to push the READ button to the bottom
               of a stretched card. With the button gone the body is just the badge and the
               title, sized to its own content like .watch-card-body. */
            .reading-card-body {
                padding: 14px 16px 16px;
            }
            .reading-card-title {
                font-family: var(--font-primary);
                font-weight: 600;
                font-size: 0.9rem;
                line-height: 1.3;
                color: #fff;
                margin: 0;
            }
            /* The badge shares a row with the hover "Read" label, which sits at its right. */
            .reading-card-meta {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                gap: 10px;
                margin: 0 0 6px;
            }
            .library-category-badge {
                display: inline-block;
                font-family: var(--font-primary);
                font-size: 0.62rem;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                color: rgba(255,255,255,0.5);
                margin: 0 0 6px;
            }
            /* Inside .reading-card-meta the badge's own bottom margin would break the row's
               baseline alignment. */
            .reading-card-meta .library-category-badge { margin: 0; }

            /* READ is not a persistent button. It was the heaviest element on every card — a
               solid white block repeated 80 times down the grid, competing with the covers it
               was meant to serve. The whole card is the link now (.reading-card is an <a>),
               and this label only surfaces on hover, when it becomes useful.

               It sits in the badge row rather than over the cover: both corners of the cover
               are already occupied — the generated tile bottom-aligns its author, and several
               jackets run their own title to the top trim edge (In Praise of Shadows, The Eyes
               of the Skin) — so the label landed on the cover's own typography whichever corner
               it took, and no scrim fixed that without dimming the cover itself. */
            .reading-card-read {
                font-family: var(--font-primary);
                font-size: 0.62rem;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                color: #fff;
                display: inline-flex;
                align-items: center;
                gap: 6px;
                flex: none;
                opacity: 0;
                transform: translateX(-4px);
                transition: opacity 0.3s var(--ease-smooth), transform 0.3s var(--ease-smooth);
            }
            .reading-card-read::after {
                content: "";
                width: 12px;
                height: 1px;
                background: currentColor;
                transition: width 0.3s var(--ease-smooth);
            }
            .reading-card:hover .reading-card-read,
            .reading-card:focus-visible .reading-card-read {
                opacity: 1;
                transform: translateX(0);
            }
            .reading-card:hover .reading-card-read::after { width: 18px; }
            /* The card is the link now, so it carries the focus ring the old button used to.
               Without this, keyboard users get the hover label but no indication of which
               card is focused. */
            .reading-card:focus-visible {
                outline: 2px solid #fff;
                outline-offset: 2px;
            }

            /* --- Watch List grid + card --- */
            .watch-card {
                display: block;
                background-color: #0a0a0a;
                border-radius: 0; /* Squircle, not circle — matches the site's art direction */
                overflow: hidden;
                text-decoration: none;
                color: inherit;
            }
            .watch-card-thumb-wrap {
                position: relative;
                width: 100%;
                aspect-ratio: 16/9;
                background-color: #111;
                overflow: hidden;
            }
            .watch-card-thumb {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
                transition: transform 0.8s var(--ease-smooth);
            }
            .watch-card:hover .watch-card-thumb {
                transform: scale(1.1);
            }
            .watch-card-platform {
                position: absolute;
                top: 10px;
                left: 10px;
                background: rgba(0,0,0,0.75);
                color: #fff;
                font-family: var(--font-primary);
                font-size: 0.62rem;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                padding: 4px 8px;
                border-radius: 0; /* Squircle, not circle — matches the site's art direction */
            }
            /* Padding and title size match .reading-card-body / .reading-card-title exactly.
               The two tabs previously ran 12/14/14 against 14/16/16 and 0.88rem against
               0.9rem — differences too small to read as intent, but enough that the cards
               didn't line up when switching between tabs. */
            .watch-card-body {
                padding: 14px 16px 16px;
            }
            .watch-card-title {
                font-family: var(--font-primary);
                font-weight: 600;
                font-size: 0.9rem;
                line-height: 1.3;
                color: #fff;
                margin: 0;
            }


            /* [NEW] Archive tab: infinite masonry scroll, no visible hero/title by design */
            .library-masonry-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 28px;
                width: 100%;
            }
            @media (min-width: 640px) {
                .library-masonry-grid { grid-template-columns: repeat(3, 1fr); gap: 32px; }
            }

            /* [NEW] Desktop-only: free-pan 2D canvas (Figma/Miro style) replacing the vertical grid */
            .library-canvas-viewport {
                display: none;
            }
            @media (min-width: 992px) {
                .library-masonry-grid { display: none; }
                .library-loader { display: none !important; }
                #library-sentinel { display: none; }

                .library-canvas-viewport {
                    /* Was position:fixed spanning 100vw/100vh — that made the drag canvas cover
                       the entire screen including the tab bar above it, so once a visitor
                       opened the Archive tab there was no way left to click back to Reading
                       List / Watch List. Contained within the panel instead: still a large,
                       genuinely free-pan drag area (the JS already measures via
                       viewport.clientWidth/clientHeight, not window.innerWidth/innerHeight, so
                       no script changes were needed for this to keep working), just not a
                       full-screen takeover. */
                    display: block;
                    position: relative;
                    width: 100%;
                    height: 70vh;
                    min-height: 480px;
                    overflow: hidden;
                    cursor: grab;
                    background: #000;
                    z-index: 1;
                }
                .library-canvas-viewport.is-dragging {
                    cursor: grabbing;
                }
                .library-canvas {
                    position: absolute;
                    top: 0;
                    left: 0;
                    width: 0;
                    height: 0;
                    will-change: transform;
                }
                .library-canvas.is-blurred .library-item {
                    filter: blur(6px);
                }
                .library-canvas-viewport .library-item {
                    position: absolute;
                    transition: filter 0.15s ease;
                }
            }

            .library-item {
                position: relative;
                width: 100%;
                border-radius: 0;
                overflow: hidden;
                background-color: #111;
                cursor: pointer;
                user-select: none;
                -webkit-user-select: none;
            }
            /* Entrance reveal for batch-appended items (see library-archive-grid's IntersectionObserver
               below) — opacity/scale only, not translateY, since the desktop canvas-pan
               mode positions .library-item absolutely and already owns its own transform for
               dragging; stacking a translate here would fight that. */
            .library-item--reveal {
                opacity: 0;
                transform: scale(0.96);
                transition: opacity var(--reveal-duration, 0.7s) var(--ease-smooth, cubic-bezier(0.19, 1, 0.22, 1)),
                            transform var(--reveal-duration, 0.7s) var(--ease-smooth, cubic-bezier(0.19, 1, 0.22, 1));
            }
            .library-item--reveal.is-visible {
                opacity: 1;
                transform: scale(1);
            }
            @media (prefers-reduced-motion: reduce) {
                .library-item--reveal { opacity: 1; transform: none; transition: none; }
            }
            .library-item-media {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
                transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1);
            }
            .library-item:hover .library-item-media {
                transform: scale(1.04);
            }
            .library-item-poster {
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                padding: 24px;
                box-sizing: border-box;
            }
            .library-item-poster-text {

        <script>
            document.addEventListener("DOMContentLoaded", () => {
                const footerPromise = fetch('footer.html').then(response => response.text());
                const preloader = document.getElementById('preloader');

                // document.readyState/window.load as a promise, alongside footerPromise —
                // the bar holds at 90% (visibly still working) until both resolve, instead
                // of racing to 100% on a timer and silently freezing there while still
                // waiting on these same signals underneath.
                const pageReadyPromise = new Promise((resolve) => {
                    if (document.readyState === 'complete') { resolve(); return; }
                    const fallbackTimer = setTimeout(resolve, 4000);
                    window.addEventListener('load', () => { clearTimeout(fallbackTimer); resolve(); });
                });

                let currentProgress = 0;
                const counter = document.getElementById('counter');
                const bar = document.getElementById('bar');
                const phraseEl = preloader ? preloader.querySelectorAll('.corner-text')[3] : null;
                const phrases = ["SYSTEM CHECK...", "PREPARING ASSETS...", "ALIGNING PIXELS...", "OPTIMIZING UI..."];

                const HOLD_AT = 90;
                let assetsSettled = false;
                Promise.all([footerPromise, pageReadyPromise]).then(() => { assetsSettled = true; });

                function updateCounter() {
                    const jump = Math.floor(Math.random() * 40) + 30;
                    currentProgress += jump;
                    const ceiling = assetsSettled ? 100 : HOLD_AT;
                    if (currentProgress > ceiling) currentProgress = ceiling;

                    if(counter) counter.innerText = currentProgress.toString().padStart(2, '0') + "%";
                    if(bar) bar.style.width = currentProgress + "%";

                    if(phraseEl) {
                        let pIndex = Math.floor((currentProgress / 100) * phrases.length);
                        if (pIndex >= phrases.length) pIndex = phrases.length - 1;
                        phraseEl.innerText = phrases[pIndex];
                    }

                    const delay = currentProgress < ceiling ? Math.floor(Math.random() * 20) + 10 : 80;

                    if (currentProgress < 100) {
                        setTimeout(updateCounter, delay);
                    } else {
                        const counterWrapper = document.querySelector('.counter-wrapper');
                        if (counterWrapper) counterWrapper.classList.add('fade-out');

                        footerPromise.then((footerData) => {
                            const tempDiv = document.createElement('div');
                            tempDiv.innerHTML = footerData;
                            tempDiv.querySelectorAll('[data-w-id]').forEach(el => el.removeAttribute('data-w-id'));

                            const footerContainer = document.getElementById('footer-container');
                            if (footerContainer) footerContainer.innerHTML = tempDiv.innerHTML;

                            requestAnimationFrame(() => {
                                if (window.Webflow) {
                                    Webflow.destroy();
                                    Webflow.ready();
                                    if (Webflow.require('ix2')) {
                                        Webflow.require('ix2').init();
                                    }
                                }
                                if (typeof window.initFooterGSAP === 'function') {
                                    window.initFooterGSAP();
                                }
                                if (window.ScrollTrigger) {
                                    ScrollTrigger.refresh();
                                }
                                setTimeout(finishLoading, 50);
                            });
                        }).catch(error => {
                            console.error("Error fetching content:", error);
                            finishLoading();
                        });
                    }
                }

                function finishLoading() {
                    if(preloader) {
                        preloader.classList.add('finished');
                    }
                    document.body.style.overflow = "auto";
                    document.body.classList.remove('preloader-active');
                    if (window.lenis) window.lenis.start();
                    window.dispatchEvent(new CustomEvent('preloaderDone'));
                }

                document.body.classList.add('preloader-active');
                setTimeout(updateCounter, 50);
            });
        </script>

        <script>
            // Infinite-scroll masonry: fetches data/library-archive.json once, then keeps appending
            // (re-shuffled) copies of the same set as the user scrolls, for an endless feed.
            document.addEventListener('DOMContentLoaded', () => {
                const grid = document.getElementById('library-archive-grid');
                const loader = document.getElementById('library-loader');
                const sentinel = document.getElementById('library-sentinel');
                if (!grid || !sentinel) return;

                const videoModal = document.getElementById('library-video-modal');
                const modalVideo = document.getElementById('library-modal-video-player');
                const videoModalClose = document.getElementById('library-video-modal-close');

                const lightboxModal = document.getElementById('library-lightbox-modal');
                const lightboxImg = document.getElementById('library-lightbox-img');
                const lightboxClose = document.getElementById('library-lightbox-close');

                let allItems = [];
                let sourceItems = [];
                let loading = false;

                const applyFilter = () => {
                    const category = window.libraryFilter?.category || 'all';
                    sourceItems = category === 'all'
                        ? allItems
                        : allItems.filter(item => item.category === category);
                };

                const shuffle = (arr) => {
                    const copy = [...arr];
                    for (let i = copy.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [copy[i], copy[j]] = [copy[j], copy[i]];
                    }
                    return copy;
                };

                // Shared: shows item.caption after the cursor sits on a piece for ~1s
                const attachCaptionHover = (el, item) => {
                    if (!item.caption) return;
                    const caption = document.createElement('div');
                    caption.className = 'library-item-caption';
                    caption.textContent = item.caption;
                    el.appendChild(caption);

                    let hoverTimer = null;
                    el.addEventListener('mouseenter', () => {
                        hoverTimer = setTimeout(() => caption.classList.add('is-visible'), 1000);
                    });
                    el.addEventListener('mouseleave', () => {
                        clearTimeout(hoverTimer);
                        caption.classList.remove('is-visible');
                    });
                };

                            }

                        const videoEl = el.querySelector('video');

                    setTimeout(() => {

                });
            });

        <script>
            // Desktop-only: free-pan 2D canvas (Figma/Miro style). An endless tile grid keyed
            // by integer (col,row) coordinates. Each cell is assigned a stable item the first
            // time it's revealed, so panning back to a spot always shows the same tile.
            document.addEventListener('DOMContentLoaded', () => {
                const viewport = document.getElementById('library-canvas-viewport');
                const canvas = document.getElementById('library-canvas');
                if (!viewport || !canvas) return;
                if (!window.matchMedia('(min-width: 992px)').matches) return; // desktop only

                const videoModal = document.getElementById('library-video-modal');
                const modalVideo = document.getElementById('library-modal-video-player');
                const lightboxModal = document.getElementById('library-lightbox-modal');
                const lightboxImg = document.getElementById('library-lightbox-img');

                const CELL_W = 300;
                const CELL_H = 400;
                const GAP = 48;
                const STEP_W = CELL_W + GAP;
                const STEP_H = CELL_H + GAP;
                const BUFFER = 1; // extra rows/cols rendered beyond the visible viewport

                let allItems = [];
                let sourceItems = [];
                const cellData = new Map();   // "col,row" -> item data (stable per cell)
                const cellEls = new Map();    // "col,row" -> DOM element currently mounted

                const applyFilter = () => {
                    const category = window.libraryFilter?.category || 'all';
                    sourceItems = category === 'all'
                        ? allItems
                        : allItems.filter(item => item.category === category);
                };

                const pickItemForCell = (col, row) => {
                    const key = `${col},${row}`;
                    if (!cellData.has(key)) {
                        // Deterministic pseudo-random pick so a given cell always resolves to the same item
                        const seed = Math.abs((col * 73856093) ^ (row * 19349663));
                        const index = sourceItems.length ? seed % sourceItems.length : 0;
                        cellData.set(key, sourceItems[index]);
                    }
                    return cellData.get(key);
                };

                const buildTile = (item, col, row) => {
                    const el = document.createElement('div');
                    el.className = 'library-item';
                    el.style.width = `${CELL_W}px`;
                    el.style.height = `${CELL_H}px`;
                    el.style.left = `${col * STEP_W}px`;
                    el.style.top = `${row * STEP_H}px`;

                    if (!item) return el;

                    // viewport calls setPointerCapture() on drag, which in some browsers redirects
                    // the synthetic click away from the tile that was actually pressed. Clicks are
                    // handled once, by delegation, on the viewport itself — see below.

                        el.innerHTML = `<img src="${item.src}" alt="${item.alt || ''}" loading="lazy" decoding="async" class="library-item-media" draggable="false">`;
                    } else if (item.type === 'video') {
                        el.innerHTML = `<video class="library-item-media" loop muted playsinline preload="metadata" poster="${item.poster || ''}"><source src="${item.src}" type="video/mp4"></video>`;
                        const videoEl = el.querySelector('video');
                        el.addEventListener('mouseenter', () => videoEl?.play().catch(() => {}));
                        el.addEventListener('mouseleave', () => { videoEl?.pause(); if (videoEl) videoEl.currentTime = 0; });
                    } else if (item.type === 'poster') {
                        el.innerHTML = `<div class="library-item-poster" style="background:${item.bg || '#111'};"><span class="library-item-poster-text" style="color:${item.color || '#fff'};">${item.text || ''}</span></div>`;
                    }

                            lightboxModal.classList.add('active');
                        }

                    renderTilesRAF = requestAnimationFrame(() => {

                    const vh = viewport.clientHeight;

                    const firstRow = Math.floor(-originY / STEP_H) - BUFFER;
                    const lastRow = Math.floor((-originY + vh) / STEP_H) + BUFFER;

                    whooshGain.gain.setValueAtTime(0, ctx.currentTime);

                    const now = performance.now();
                    if (now - lastWhooshUpdate < 40) return; // throttle to ~25fps of audio updates
                    lastWhooshUpdate = now;

                    const ratio = clamped / 120;

                    const targetFreq = 50 + clamped * 0.5;
                    const targetGain = 0.16 + ratio * 0.9; // audible floor + scales up hard with speed
                    whooshOsc.frequency.setTargetAtTime(targetFreq, ctx.currentTime, 0.05);
                    whooshGain.gain.setTargetAtTime(targetGain, ctx.currentTime, 0.05);

                    if (whooshNoiseFilter && whooshNoiseGain) {
                        const targetNoiseFreq = 100 + ratio * 200;
                        const targetNoiseGain = 0.04 + ratio * 0.15;
                        whooshNoiseFilter.frequency.setTargetAtTime(targetNoiseFreq, ctx.currentTime, 0.05);
                        whooshNoiseGain.gain.setTargetAtTime(targetNoiseGain, ctx.currentTime, 0.05);
                    }
                };

                const stopWhoosh = () => {
                    if (!whooshOsc || !audioCtx) return;
                    const ctx = audioCtx;
                    const fadeOutTime = 0.25;

                    // Cancel any in-flight ramps first so the fade-out starts from the actual current value
                    whooshGain.gain.cancelScheduledValues(ctx.currentTime);
                    whooshGain.gain.setValueAtTime(whooshGain.gain.value, ctx.currentTime);
                    whooshGain.gain.linearRampToValueAtTime(0, ctx.currentTime + fadeOutTime);

                    if (whooshNoiseGain) {
                        whooshNoiseGain.gain.cancelScheduledValues(ctx.currentTime);
                        whooshNoiseGain.gain.setValueAtTime(whooshNoiseGain.gain.value, ctx.currentTime);
                        whooshNoiseGain.gain.linearRampToValueAtTime(0, ctx.currentTime + fadeOutTime);
                    }

                    const oscToStop = whooshOsc;
                    const noiseToStop = whooshNoiseSource;
                    // Stop strictly after the ramp has fully reached 0: no truncated waveform, no click
                    setTimeout(() => {
                        try { oscToStop.stop(); } catch (err) {}
                        try { noiseToStop?.stop(); } catch (err) {}
                    }, fadeOutTime * 1000 + 30);

                    whooshOsc = null;
                    whooshGain = null;
                    whooshNoiseSource = null;
                    whooshNoiseFilter = null;
                    whooshNoiseGain = null;
                };

                const stopInertia = () => {
                    if (inertiaRAF) cancelAnimationFrame(inertiaRAF);
                    inertiaRAF = null;
                };

                const runInertia = () => {
                    stopInertia();
                    const step = () => {
                        velocityX *= 0.92;
                        velocityY *= 0.92;
                        originX += velocityX;
                        originY += velocityY;
                        applyTransform();
                        renderVisibleTiles();

                        if (Math.abs(velocityX) > 0.5 || Math.abs(velocityY) > 0.5) {
                            inertiaRAF = requestAnimationFrame(step);
                        } else {

                        }

                    draggedDistance = 0;
                    lastPointerX = e.clientX;
                    lastPointerY = e.clientY;

                    viewport.setPointerCapture(e.pointerId);

                    const now = performance.now();
                    const dt = Math.max(now - lastMoveTime, 1);
                    const dx = e.clientX - lastPointerX;
                    const dy = e.clientY - lastPointerY;

                    originX += dx;
                    originY += dy;
                    velocityX = dx / dt * 16; // normalize to ~per-frame velocity
                    velocityY = dy / dt * 16;
                    draggedDistance += Math.abs(dx) + Math.abs(dy);

                    lastPointerX = e.clientX;
                    lastPointerY = e.clientY;
                    lastMoveTime = now;

                    applyTransform();
                    scheduleRenderVisibleTiles();

                    // Motion blur kicks in once the drag is moving fast enough
                    const speed = Math.abs(velocityX) + Math.abs(velocityY);
                    setBlur(speed > 18);
                    updateWhoosh(speed);
                    clearTimeout(blurTimeout);
                    blurTimeout = setTimeout(() => setBlur(false), 120);
                });

                const endDrag = (e) => {
                    if (!isPointerDown) return;
                    isPointerDown = false;
                    viewport.classList.remove('is-dragging');
                    if (e && e.pointerId !== undefined) {
                        try { viewport.releasePointerCapture(e.pointerId); } catch (err) {}
                    }
                    stopWhoosh();
                    runInertia();
                };

                viewport.addEventListener('pointercancel', endDrag);

                // display:none while another tab is active. viewport.clientWidth/clientHeight
                // (used by renderVisibleTiles to decide which cells are on-screen) read as 0
                // while a fixed-position ancestor chain is hidden this way, so the very first
                // renderVisibleTiles() call — fired above by the library-archive.json fetch, which can
                // resolve before the visitor ever switches to Archive — may compute an empty
                // viewport and mount no tiles. Re-run it once the tab-switcher (see the
                // library-tabs script near the closing body tag) actually shows this panel.
                window.addEventListener('libraryTabActivated', (e) => {
                    if (e.detail?.tab !== 'archive') return;
                    if (window.matchMedia('(min-width: 992px)').matches) renderVisibleTiles();
                });

                fetch('data/library-archive.json?v=2')
                    .then(r => r.json())
                    .then(data => {
                        allItems = Array.isArray(data) ? data : [];
                        applyFilter();
                        renderVisibleTiles();
                    })
                    .catch(err => console.error('Failed to load library-archive.json for canvas', err));

                // Re-filter and rebuild every currently-mounted tile when the category filter changes
                window.addEventListener('libraryFilterChange', () => {
                    applyFilter();
                    cellData.clear();
                    cellEls.forEach(el => el.remove());
                    cellEls.clear();
                    renderVisibleTiles();
                });
            });

        <script>
            // [NEW] Pinch/scroll/button zoom + drag-to-pan for the Archive tab's image lightbox.
            // Independent of the two scripts that can open this same modal (mobile grid, desktop
            // canvas) — it just watches the modal's own state, so it works no matter which one
            // opened it, and resets automatically whenever the modal closes.
            document.addEventListener('DOMContentLoaded', () => {
                const modal = document.getElementById('library-lightbox-modal');
                const frame = document.getElementById('library-lightbox-frame');
                const img = document.getElementById('library-lightbox-img');
                const zoomInBtn = document.getElementById('library-zoom-in');
                const zoomOutBtn = document.getElementById('library-zoom-out');
                const zoomResetBtn = document.getElementById('library-zoom-reset');
                if (!modal || !frame || !img) return;

                const MIN_SCALE = 1;
                const MAX_SCALE = 4;
                let scale = 1;
                let panX = 0;
                let panY = 0;

                const applyZoomTransform = () => {
                    img.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
                    frame.classList.toggle('is-zoomed', scale > 1);
                    if (zoomResetBtn) zoomResetBtn.textContent = `${Math.round(scale * 100)}%`;
                };

                const clampPan = () => {
                    // Keep the image from being dragged so far it leaves visible content behind
                    const frameRect = frame.getBoundingClientRect();
                    const maxX = (frameRect.width * (scale - 1)) / 2;
                    const maxY = (frameRect.height * (scale - 1)) / 2;
                    panX = Math.max(-maxX, Math.min(maxX, panX));
                    panY = Math.max(-maxY, Math.min(maxY, panY));
                };

                const setScale = (next) => {
                    scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, next));
                    if (scale === 1) { panX = 0; panY = 0; }
                    clampPan();
                    applyZoomTransform();
                };

                const resetZoom = () => { scale = 1; panX = 0; panY = 0; applyZoomTransform(); };

                zoomInBtn?.addEventListener('click', () => setScale(scale + 0.5));
                zoomOutBtn?.addEventListener('click', () => setScale(scale - 0.5));
                zoomResetBtn?.addEventListener('click', resetZoom);

                // Double-click/tap toggles between fit and 2x zoom
                img.addEventListener('dblclick', () => setScale(scale > 1 ? 1 : 2));

                // Scroll wheel to zoom, centered on the cursor position
                frame.addEventListener('wheel', (e) => {
                    if (!modal.classList.contains('active')) return;
                    e.preventDefault();
                    const delta = e.deltaY > 0 ? -0.25 : 0.25;
                    setScale(scale + delta);
                }, { passive: false });

                let isDragging = false;
                let startX = 0, startY = 0, startPanX = 0, startPanY = 0;

                frame.addEventListener('pointerdown', (e) => {
                    if (scale <= 1) return;
                    isDragging = true;
                    frame.classList.add('is-dragging');
                    startX = e.clientX;
                    startY = e.clientY;
                    startPanX = panX;
                    startPanY = panY;
                    frame.setPointerCapture(e.pointerId);
                });
                frame.addEventListener('pointermove', (e) => {
                    if (!isDragging) return;
                    panX = startPanX + (e.clientX - startX);
                    panY = startPanY + (e.clientY - startY);
                    clampPan();
                    applyZoomTransform();
                });
                const endDrag = (e) => {
                    if (!isDragging) return;
                    isDragging = false;
                    frame.classList.remove('is-dragging');
                    if (e?.pointerId !== undefined) {
                        try { frame.releasePointerCapture(e.pointerId); } catch (err) {}
                    }
                };
                frame.addEventListener('pointerup', endDrag);
                frame.addEventListener('pointercancel', endDrag);

                // Reset zoom whenever the modal is closed, from any trigger
                new MutationObserver(() => {
                    if (!modal.classList.contains('active')) resetZoom();
                }).observe(modal, { attributes: true, attributeFilter: ['class'] });
            });

        <script>
            // [NEW] This whole page is permanently dark (black bg, white text), unlike the
            // rest of the site where the navbar only goes white-on-transparent over a hero
            // and flips to a solid white bar once scrolled (see .navbar-invert-top / .scrolled
            // in css/style.css). script.js's loadNavbar() fetches navbar.html asynchronously
            // and doesn't fire an event on completion, so a MutationObserver on the container
            // is used here to add .library-invert (defined in the <style> block above) the
            // moment the real .navbar element actually lands in the DOM — a fixed setTimeout
            // guess would be timing-dependent on the fetch, this isn't.
            document.addEventListener('DOMContentLoaded', () => {
                const navContainer = document.getElementById('navbar-container');
                if (!navContainer) return;

                const applyInvert = () => {
                    const navbarEl = navContainer.querySelector('.navbar');
                    if (navbarEl) navbarEl.classList.add('library-invert');
                    return !!navbarEl;
                };

                if (applyInvert()) return;

                const observer = new MutationObserver(() => {
                    if (applyInvert()) observer.disconnect();
                });
                observer.observe(navContainer, { childList: true, subtree: true });
            });
        </script>
        <script>
            // [NEW] Library tab switcher: Reading List / Watch List / Archive. Plain show/hide,
            // no page reload. Active tab is synced to the URL hash (#reading-list / #watch-list
            // / #archive) so it's linkable/shareable and survives a refresh, but the hash is
            // optional — defaults to Reading List when absent or unrecognized.
            document.addEventListener('DOMContentLoaded', () => {
                const tabBar = document.getElementById('library-tabs');
                if (!tabBar) return;

                const tabButtons = Array.from(tabBar.querySelectorAll('.library-tab-btn'));
                const panels = Array.from(document.querySelectorAll('.library-panel'));
                const validTabs = tabButtons.map(btn => btn.dataset.tab);
                const DEFAULT_TAB = 'reading-list';

                const activateTab = (tab, { updateHash = true } = {}) => {
                    if (!validTabs.includes(tab)) tab = DEFAULT_TAB;

                    tabButtons.forEach(btn => {
                        const isActive = btn.dataset.tab === tab;
                        btn.classList.toggle('is-active', isActive);
                        btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
                    });
                    panels.forEach(panel => {
                        panel.classList.toggle('is-active', panel.dataset.panel === tab);
                    });

                    if (updateHash) {
                        const newHash = `#${tab}`;
                        if (window.location.hash !== newHash) {
                            history.replaceState(null, '', newHash);
                        }
                    }

                    // Lets tab-scoped scripts (e.g. the Archive canvas) re-measure once their
                    // panel actually becomes visible instead of assuming they're visible at init.
                    window.dispatchEvent(new CustomEvent('libraryTabActivated', { detail: { tab } }));
                };

                tabBar.addEventListener('click', (e) => {
                    const btn = e.target.closest('.library-tab-btn');
                    if (!btn) return;
                    activateTab(btn.dataset.tab);
                });

                const initialTab = (window.location.hash || '').replace('#', '') || DEFAULT_TAB;
                activateTab(initialTab, { updateHash: false });

                // Support back/forward navigation and manually-edited hashes
                window.addEventListener('hashchange', () => {
                    const tab = (window.location.hash || '').replace('#', '') || DEFAULT_TAB;
                    activateTab(tab, { updateHash: false });
                });
            });
        </script>
        <script>
            // [NEW] Reading List: renders curated external reading entries (articles, essays,
            // books) from data/library-reading.json, matching this page's existing
            // fetch-and-render convention. Book entries carry a real `cover` image; the rest
            // link out to articles and essays with no cover art, and fall back to a composed
            // tile setting the author instead. The card itself is the link, like .watch-card;
            // "Read" surfaces over the cover on hover rather than sitting on every card as a
            // permanent button. Each entry becomes:
            //   <a class="reading-card" href="..." target="_blank">
            //     <div class="reading-card-media">
            //       <img class="reading-card-cover" src="..." alt="">   (only if item.cover set)
            //       <div class="reading-card-cover-placeholder">...</div> (fallback otherwise)
            //     </div>
            //     <div class="reading-card-body">
            //       <div class="reading-card-meta">
            //         <span class="library-category-badge">...</span>
            //         <span class="reading-card-read">Read</span>   (hover only)
            //       </div>
            //       <p class="reading-card-title">...</p>
            //     </div>
            //   </a>
            document.addEventListener('DOMContentLoaded', () => {
                const grid = document.getElementById('reading-list-grid');
                const emptyNote = document.getElementById('reading-list-empty');
                const filterBar = document.getElementById('reading-list-filter');
                if (!grid) return;

                const escapeHtml = (str) => String(str || '').replace(/[&<>"']/g, (c) => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
                }[c]));

                const buildCard = (item) => {
                    const card = document.createElement('a');
                    card.className = 'reading-card';
                    card.href = item.url || '#';
                    card.target = '_blank';
                    card.rel = 'noopener noreferrer';
                    if (item.category) card.dataset.category = item.category;
                    const title = item.title || 'Untitled';
                    const coverHtml = item.cover
                        ? `<img class="reading-card-cover" src="${escapeHtml(item.cover)}" alt="${escapeHtml(title)}" loading="lazy" decoding="async">`
                        : `<div class="reading-card-cover-placeholder" aria-hidden="true">
                               <span class="placeholder-rule"></span>
                               ${item.author ? `<span class="placeholder-author">${escapeHtml(item.author)}</span>` : ''}
                           </div>`;
                    card.innerHTML = `
                        <div class="reading-card-media">${coverHtml}</div>
                        <div class="reading-card-body">
                            <div class="reading-card-meta">
                                ${item.categoryLabel ? `<span class="library-category-badge">${escapeHtml(item.categoryLabel)}</span>` : '<span></span>'}
                                <span class="reading-card-read" aria-hidden="true">Read</span>
                            </div>
                            <p class="reading-card-title">${escapeHtml(title)}</p>
                        </div>
                    `;
                    return card;
                };

                const buildFilterBar = (items) => {
                    if (!filterBar) return;
                    const seen = new Map();
                    items.forEach(item => {
                        if (item.category && !seen.has(item.category)) {
                            seen.set(item.category, item.categoryLabel || item.category);
                        }
                    });
                    const allBtn = `<button class="library-category-btn is-active" type="button" data-category="all">All</button>`;
                    const catBtns = Array.from(seen.entries())
                        .map(([cat, label]) => `<button class="library-category-btn" type="button" data-category="${escapeHtml(cat)}">${escapeHtml(label)}</button>`)
                        .join('');
                    filterBar.innerHTML = allBtn + catBtns;

                    filterBar.addEventListener('click', (e) => {
                        const btn = e.target.closest('.library-category-btn');
                        if (!btn) return;
                        filterBar.querySelectorAll('.library-category-btn').forEach(b => b.classList.toggle('is-active', b === btn));
                        const category = btn.dataset.category;
                        grid.querySelectorAll('.reading-card').forEach(card => {
                            const show = category === 'all' || card.dataset.category === category;
                            card.style.display = show ? '' : 'none';
                        });
                    });
                };

                fetch('data/library-reading.json?v=3')
                    .then(r => r.json())
                    .then(data => {
                        const items = Array.isArray(data) ? data : [];
                        if (!items.length) {
                            if (emptyNote) emptyNote.style.display = 'block';
                            return;
                        }
                        if (emptyNote) emptyNote.style.display = 'none';
                        buildFilterBar(items);
                        const fragment = document.createDocumentFragment();
                        items.forEach(item => fragment.appendChild(buildCard(item)));
                        grid.appendChild(fragment);
                    })
                    .catch(err => {
                        console.error('Failed to load library-reading.json', err);
                        if (emptyNote) emptyNote.style.display = 'block';
                    });
            });
        </script>
