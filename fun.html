        <style>
            /* Anti-Flicker Inline CSS */
            body.preloader-active { overflow: hidden; }
            #preloader { position: fixed; inset: 0; background-color: #000; color: #fff; z-index: 99999; display: flex; justify-content: center; align-items: center; flex-direction: column; transition: transform 0.8s cubic-bezier(0.19, 1, 0.22, 1); transform-origin: top; }
            #preloader.finished { transform: translateY(-100%); }
            .counter-wrapper { position: relative; text-align: center; transition: opacity 0.5s ease; }
            .counter-wrapper.fade-out { opacity: 0; }
            #counter { font-size: 15vw; font-weight: 700; letter-spacing: -0.04em; font-family: 'Inter', sans-serif; display: block; }
            .corner-text { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.6; font-family: 'Inter', sans-serif; }
            .top-corners, .bottom-corners { position: absolute; width: calc(100% - 60px); left: 30px; right: 30px; display: flex; justify-content: space-between; }
            .top-corners { top: 30px; } .bottom-corners { bottom: 40px; }
            .progress-track { position: absolute; bottom: 0; left: 0; width: 100%; height: 6px; background: #1a1a1a; }
            .progress-fill { height: 100%; width: 0%; background: #ffffff; transition: width 0.2s ease; }
            @media (max-width: 767px) { #counter { font-size: 20vw; } .corner-text { font-size: 9px; } .top-corners, .bottom-corners { width: calc(100% - 40px); left: 20px; right: 20px; } .top-corners { top: 20px; } .bottom-corners { bottom: 25px; } }

            /* [NEW] Fun page: infinite masonry scroll, no visible hero/title by design */
            .visually-hidden {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
                white-space: nowrap;
                border: 0;
            }

            .fun-masonry-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 28px;
                width: 100%;
            }
            @media (min-width: 640px) {
                .fun-masonry-grid { grid-template-columns: repeat(3, 1fr); gap: 32px; }
            }

            /* [NEW] Desktop-only: free-pan 2D canvas (Figma/Miro style) replacing the vertical grid */
            .fun-canvas-viewport {
                display: none;
            }
            @media (min-width: 992px) {
                .fun-masonry-grid { display: none; }
                .fun-loader { display: none !important; }
                #fun-sentinel { display: none; }

                .fun-canvas-viewport {
                    display: block;
                    position: fixed;
                    top: 0; left: 0;
                    width: 100vw;
                    height: 100vh;
                    overflow: hidden;
                    cursor: grab;
                    background: #fff;
                    z-index: 1;
                }
                .fun-canvas-viewport.is-dragging {
                    cursor: grabbing;
                }
                .fun-canvas {
                    position: absolute;
                    top: 0;
                    left: 0;
                    width: 0;
                    height: 0;
                    will-change: transform;
                }
                .fun-canvas.is-blurred .fun-item {
                    filter: blur(6px);
                }
                .fun-canvas-viewport .fun-item {
                    position: absolute;
                    transition: filter 0.15s ease;
                }
            }

            .fun-item {
                position: relative;
                width: 100%;
                border-radius: 0;
                overflow: hidden;
                background-color: #111;
                cursor: pointer;
                user-select: none;
                -webkit-user-select: none;
            }
            /* Entrance reveal for batch-appended items (see fun-grid's IntersectionObserver
               below) — opacity/scale only, not translateY, since the desktop canvas-pan
               mode positions .fun-item absolutely and already owns its own transform for
               dragging; stacking a translate here would fight that. */
            .fun-item--reveal {
                opacity: 0;
                transform: scale(0.96);
                transition: opacity var(--reveal-duration, 0.7s) var(--ease-smooth, cubic-bezier(0.19, 1, 0.22, 1)),
                            transform var(--reveal-duration, 0.7s) var(--ease-smooth, cubic-bezier(0.19, 1, 0.22, 1));
            }
            .fun-item--reveal.is-visible {
                opacity: 1;
                transform: scale(1);
            }
            @media (prefers-reduced-motion: reduce) {
                .fun-item--reveal { opacity: 1; transform: none; transition: none; }
            }
            .fun-item-media {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
                transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1);
            }
            .fun-item:hover .fun-item-media {
                transform: scale(1.04);
            }
            .fun-item-poster {
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                padding: 24px;
                box-sizing: border-box;
            }
            .fun-item-poster-text {
                font-family: var(--font-primary);
                font-weight: 800;
                font-size: clamp(1.1rem, 2.4vw, 1.6rem);
                letter-spacing: -0.02em;
                line-height: 1.2;
                white-space: pre-line;
            }

            /* [NEW] Caption shown after ~1s of the cursor sitting still on a piece */
            .fun-item-caption {
                position: absolute;
                bottom: 10px;
                left: 10px;
                right: 10px;
                padding: 6px 10px;
                border-radius: 0;
                background: rgba(0,0,0,0.7);
                color: #fff;
                font-family: var(--font-primary);
                font-size: 0.7rem;
                font-weight: 500;
                font-style: italic;
                opacity: 0;
                transform: translateY(6px);
                transition: opacity 0.25s ease, transform 0.25s ease;
                pointer-events: none;
                z-index: 3;
            }
            .fun-item-caption.is-visible {
                opacity: 1;
                transform: translateY(0);
            }

            /* [NEW] Easter egg: 5 rapid clicks on a tile spins and pops it */
            .fun-item-egg {

            }
            @keyframes fun-egg-spin {

                40% { transform: scale(1.15) rotate(180deg); }
                70% { transform: scale(0.95) rotate(350deg); }

            /* [NEW] Desktop: icon-only by default, label revealed on hover — keeps the

                }
            }

            /* [NEW] Pan/zoom frame for the image lightbox. The frame clips overflow and carries
               the modal's own open/close scale animation, while #fun-lightbox-img carries only
               the zoom/pan transform driven by JS — kept separate so the two never fight over
               the same transform property. */
            .fun-lightbox-frame {
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
                touch-action: none;
                transform: scale(0.95);
                transition: transform 0.3s cubic-bezier(0.19, 1, 0.22, 1);
            }
            #fun-lightbox-modal.active .fun-lightbox-frame {
                transform: scale(1);
            }
            .fun-lightbox-frame.is-zoomed {
                cursor: grab;
            }
            .fun-lightbox-frame.is-zoomed.is-dragging {
                cursor: grabbing;
            }
            #fun-lightbox-img.lightbox-content {
                max-width: 90%;
                max-height: 90vh;
                transform: none; /* overrides the shared .lightbox-content scale-in; the frame handles that instead */
                transition: transform 0.25s cubic-bezier(0.19, 1, 0.22, 1);
                will-change: transform;
            }
            .fun-lightbox-frame.is-dragging #fun-lightbox-img {
                transition: none;
            }

            .fun-zoom-controls {
                position: absolute;
                bottom: 32px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                align-items: center;
                gap: 4px;
                background: rgba(17,17,17,0.8);
                
                
                padding: 6px;

            .fun-zoom-btn {

                align-items: center;
                justify-content: center;
                width: 36px;
                height: 36px;
                border: none;
                border-radius: 0; /* Squircle, not circle — matches the site's art direction */

                color: #fff;
                cursor: pointer;
                font-family: var(--font-primary);
                font-size: 0.7rem;

            .fun-zoom-btn:hover { background: rgba(255,255,255,0.15); }
            #fun-zoom-reset { width: auto; padding: 0 12px; }
            @media (max-width: 767px) {
                .fun-zoom-controls { bottom: 20px; }

            /* [NEW] Keep the navbar permanently visible on this page. Elsewhere script.js
               hides it on scroll-down (toggling .navbar-hidden), but Fun's desktop mode is a
               free-pan canvas rather than a normal scroll, so hide-on-scroll feels broken here. */
            .navbar.navbar-hidden {
                transform: translateY(0) !important;
            }

            /* [NEW] Elsewhere the navbar only gets its blurred background once .scrolled is
               added by script.js's scroll listener. Fun's desktop mode is drag/pan, not scroll,
               so that class rarely triggers — leaving the navbar transparent and blending into
               the canvas/grid behind it. Give it the same background permanently on this page. */
            .navbar {
                background-color: rgba(255, 255, 255, 0.75) !important;
                
                
                box-shadow: none;
                border-bottom: 1px solid rgba(0,0,0,0.04);
            }

        <script>
            document.addEventListener("DOMContentLoaded", () => {
                const footerPromise = fetch('footer.html').then(response => response.text());
                const preloader = document.getElementById('preloader');

                // document.readyState/window.load as a promise, alongside footerPromise —
                // the bar holds at 90% (visibly still working) until both resolve, instead
                // of racing to 100% on a timer and silently freezing there while still
                // waiting on these same signals underneath.
                const pageReadyPromise = new Promise((resolve) => {
                    if (document.readyState === 'complete') { resolve(); return; }
                    const fallbackTimer = setTimeout(resolve, 4000);
                    window.addEventListener('load', () => { clearTimeout(fallbackTimer); resolve(); });
                });

                let currentProgress = 0;
                const counter = document.getElementById('counter');
                const bar = document.getElementById('bar');
                const phraseEl = preloader ? preloader.querySelectorAll('.corner-text')[3] : null;
                const phrases = ["SYSTEM CHECK...", "PREPARING ASSETS...", "ALIGNING PIXELS...", "OPTIMIZING UI..."];

                const HOLD_AT = 90;
                let assetsSettled = false;
                Promise.all([footerPromise, pageReadyPromise]).then(() => { assetsSettled = true; });

                function updateCounter() {
                    const jump = Math.floor(Math.random() * 40) + 30;
                    currentProgress += jump;
                    const ceiling = assetsSettled ? 100 : HOLD_AT;
                    if (currentProgress > ceiling) currentProgress = ceiling;

                    if(counter) counter.innerText = currentProgress.toString().padStart(2, '0') + "%";
                    if(bar) bar.style.width = currentProgress + "%";

                    if(phraseEl) {
                        let pIndex = Math.floor((currentProgress / 100) * phrases.length);
                        if (pIndex >= phrases.length) pIndex = phrases.length - 1;
                        phraseEl.innerText = phrases[pIndex];
                    }

                    const delay = currentProgress < ceiling ? Math.floor(Math.random() * 20) + 10 : 80;

                    if (currentProgress < 100) {
                        setTimeout(updateCounter, delay);
                    } else {
                        const counterWrapper = document.querySelector('.counter-wrapper');
                        if (counterWrapper) counterWrapper.classList.add('fade-out');

                        footerPromise.then((footerData) => {
                            const tempDiv = document.createElement('div');
                            tempDiv.innerHTML = footerData;
                            tempDiv.querySelectorAll('[data-w-id]').forEach(el => el.removeAttribute('data-w-id'));

                            const footerContainer = document.getElementById('footer-container');
                            if (footerContainer) footerContainer.innerHTML = tempDiv.innerHTML;

                            requestAnimationFrame(() => {
                                if (window.Webflow) {
                                    Webflow.destroy();
                                    Webflow.ready();
                                    if (Webflow.require('ix2')) {
                                        Webflow.require('ix2').init();
                                    }
                                }
                                if (typeof window.initFooterGSAP === 'function') {
                                    window.initFooterGSAP();
                                }
                                if (window.ScrollTrigger) {
                                    ScrollTrigger.refresh();
                                }
                                setTimeout(finishLoading, 50);
                            });
                        }).catch(error => {
                            console.error("Error fetching content:", error);
                            finishLoading();
                        });
                    }
                }

                function finishLoading() {
                    if(preloader) {
                        preloader.classList.add('finished');
                    }
                    document.body.style.overflow = "auto";
                    document.body.classList.remove('preloader-active');
                    if (window.lenis) window.lenis.start();
                    window.dispatchEvent(new CustomEvent('preloaderDone'));
                }

                document.body.classList.add('preloader-active');
                setTimeout(updateCounter, 50);
            });
        </script>

        <script>
            // [NEW] Shared category filter state for both the mobile masonry grid and the
            // desktop canvas below. Only narrows which items are eligible for the existing
            // shuffle/placement logic in each mode — it doesn't change how either renders.
            window.funFilter = { category: 'all' };
            document.addEventListener('DOMContentLoaded', () => {
                const filterBar = document.getElementById('fun-filter-bar');
                if (!filterBar) return;
                filterBar.addEventListener('click', (e) => {
                    const btn = e.target.closest('.fun-filter-btn');
                    if (!btn) return;
                    filterBar.querySelectorAll('.fun-filter-btn').forEach(b => b.classList.toggle('is-active', b === btn));
                    window.funFilter.category = btn.dataset.category;
                    window.dispatchEvent(new CustomEvent('funFilterChange', { detail: { category: btn.dataset.category } }));
                });
            });
        </script>
        <script>
            // Infinite-scroll masonry: fetches data/fun.json once, then keeps appending
            // (re-shuffled) copies of the same set as the user scrolls, for an endless feed.
            document.addEventListener('DOMContentLoaded', () => {
                const grid = document.getElementById('fun-grid');
                const loader = document.getElementById('fun-loader');
                const sentinel = document.getElementById('fun-sentinel');
                if (!grid || !sentinel) return;

                const videoModal = document.getElementById('fun-video-modal');
                const modalVideo = document.getElementById('fun-modal-video-player');
                const videoModalClose = document.getElementById('fun-video-modal-close');

                const lightboxModal = document.getElementById('fun-lightbox-modal');
                const lightboxImg = document.getElementById('fun-lightbox-img');
                const lightboxClose = document.getElementById('fun-lightbox-close');

                let allItems = [];
                let sourceItems = [];
                let loading = false;

                const applyFilter = () => {
                    const category = window.funFilter?.category || 'all';
                    sourceItems = category === 'all'
                        ? allItems
                        : allItems.filter(item => item.category === category);
                };

                const shuffle = (arr) => {
                    const copy = [...arr];
                    for (let i = copy.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [copy[i], copy[j]] = [copy[j], copy[i]];
                    }
                    return copy;
                };

                // Shared: shows item.caption after the cursor sits on a piece for ~1s
                const attachCaptionHover = (el, item) => {
                    if (!item.caption) return;
                    const caption = document.createElement('div');
                    caption.className = 'fun-item-caption';
                    caption.textContent = item.caption;
                    el.appendChild(caption);

                    let hoverTimer = null;
                    el.addEventListener('mouseenter', () => {
                        hoverTimer = setTimeout(() => caption.classList.add('is-visible'), 1000);
                    });
                    el.addEventListener('mouseleave', () => {
                        clearTimeout(hoverTimer);
                        caption.classList.remove('is-visible');
                    });
                };

                // Same reveal weight as the rest of the site (see --reveal-duration/
                // .fade-in-section in css/style.css) — items were previously appearing
                // with zero entrance animation, since this grid is batch-built in JS
                // rather than static HTML the shared IntersectionObserver could pick up.
                const itemObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('is-visible');
                            itemObserver.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.05, rootMargin: '0px 0px 50px 0px' });

                const buildItem = (item) => {
                    const el = document.createElement('div');
                    el.className = 'fun-item fun-item--reveal';
                    el.style.aspectRatio = '3/4';
                    itemObserver.observe(el);

                    if (item.type === 'image') {
                        el.innerHTML = `<img src="${item.src}" alt="${item.alt || ''}" loading="lazy" decoding="async" class="fun-item-media">`;
                        el.addEventListener('click', () => {
                            if (lightboxImg && lightboxModal) {
                                lightboxImg.src = item.src;
                                lightboxModal.classList.add('active');
                            }
                        });
                    } else if (item.type === 'video') {
                        el.innerHTML = `<video class="fun-item-media" loop muted playsinline preload="metadata" poster="${item.poster || ''}"><source src="${item.src}" type="video/mp4"></video>`;
                        const videoEl = el.querySelector('video');
                        el.addEventListener('mouseenter', () => videoEl?.play().catch(() => {}));
                        el.addEventListener('mouseleave', () => { videoEl?.pause(); if (videoEl) videoEl.currentTime = 0; });
                        el.addEventListener('click', () => {
                            if (modalVideo && videoModal) {
                                modalVideo.src = item.src;
                                videoModal.classList.add('active');
                                modalVideo.play();
                                document.body.style.overflow = 'hidden';
                            }
                        });
                    } else if (item.type === 'poster') {
                        el.innerHTML = `<div class="fun-item-poster" style="background:${item.bg || '#111'};"><span class="fun-item-poster-text" style="color:${item.color || '#fff'};">${item.text || ''}</span></div>`;
                    }

                    attachCaptionHover(el, item);
                    return el;
                };

                const appendBatch = () => {
                    if (!sourceItems.length || loading) return;
                    loading = true;
                    if (loader) loader.style.display = 'flex';

                    // Small delay so the loader is perceptible instead of an instant snap-in
                    setTimeout(() => {
                        const batch = shuffle(sourceItems);
                        const fragment = document.createDocumentFragment();
                        batch.forEach(item => fragment.appendChild(buildItem(item)));
                        grid.appendChild(fragment);
                        loading = false;
                        if (loader) loader.style.display = 'none';
                    }, 300);
                };

                fetch('data/fun.json')
                    .then(r => r.json())
                    .then(data => {
                        allItems = Array.isArray(data) ? data : [];
                        applyFilter();
                        appendBatch(); // first batch
                        appendBatch(); // pre-fill a second batch so there's room to scroll before the observer fires
                    })
                    .catch(err => {
                        console.error('Failed to load fun.json', err);
                        if (loader) loader.textContent = 'Could not load work.';
                    });

                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) appendBatch();
                    });
                }, { rootMargin: '800px 0px' });
                observer.observe(sentinel);

                // Re-filter and restart the feed from scratch when the category filter changes
                window.addEventListener('funFilterChange', () => {
                    applyFilter();
                    grid.innerHTML = '';
                    appendBatch();
                    appendBatch();
                });

                // Modal close handlers
                const closeVideoModal = () => {
                    videoModal?.classList.remove('active');
                    if (modalVideo) { modalVideo.pause(); modalVideo.src = ''; }
                    document.body.style.overflow = '';
                };
                videoModalClose?.addEventListener('click', closeVideoModal);
                videoModal?.addEventListener('click', (e) => { if (e.target === videoModal) closeVideoModal(); });

                const closeLightbox = () => lightboxModal?.classList.remove('active');
                lightboxClose?.addEventListener('click', closeLightbox);
                lightboxModal?.addEventListener('click', (e) => { if (e.target === lightboxModal) closeLightbox(); });

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') { closeVideoModal(); closeLightbox(); }
                });
            });
        </script>
        <script>
            // Desktop-only: free-pan 2D canvas (Figma/Miro style). An endless tile grid keyed
            // by integer (col,row) coordinates. Each cell is assigned a stable item the first
            // time it's revealed, so panning back to a spot always shows the same tile.
            document.addEventListener('DOMContentLoaded', () => {
                const viewport = document.getElementById('fun-canvas-viewport');
                const canvas = document.getElementById('fun-canvas');
                if (!viewport || !canvas) return;
                if (!window.matchMedia('(min-width: 992px)').matches) return; // desktop only

                const videoModal = document.getElementById('fun-video-modal');
                const modalVideo = document.getElementById('fun-modal-video-player');
                const lightboxModal = document.getElementById('fun-lightbox-modal');
                const lightboxImg = document.getElementById('fun-lightbox-img');

                const CELL_W = 300;
                const CELL_H = 400;
                const GAP = 48;
                const STEP_W = CELL_W + GAP;
                const STEP_H = CELL_H + GAP;
                const BUFFER = 1; // extra rows/cols rendered beyond the visible viewport

                let allItems = [];
                let sourceItems = [];
                const cellData = new Map();   // "col,row" -> item data (stable per cell)
                const cellEls = new Map();    // "col,row" -> DOM element currently mounted

                const applyFilter = () => {
                    const category = window.funFilter?.category || 'all';
                    sourceItems = category === 'all'
                        ? allItems
                        : allItems.filter(item => item.category === category);
                };

                const pickItemForCell = (col, row) => {
                    const key = `${col},${row}`;
                    if (!cellData.has(key)) {
                        // Deterministic pseudo-random pick so a given cell always resolves to the same item
                        const seed = Math.abs((col * 73856093) ^ (row * 19349663));
                        const index = sourceItems.length ? seed % sourceItems.length : 0;
                        cellData.set(key, sourceItems[index]);
                    }
                    return cellData.get(key);
                };

                const buildTile = (item, col, row) => {
                    const el = document.createElement('div');
                    el.className = 'fun-item';
                    el.style.width = `${CELL_W}px`;
                    el.style.height = `${CELL_H}px`;
                    el.style.left = `${col * STEP_W}px`;
                    el.style.top = `${row * STEP_H}px`;

                    if (!item) return el;

                    // Stored on the element (instead of a per-tile click listener) because the
                    // viewport calls setPointerCapture() on drag, which in some browsers redirects
                    // the synthetic click away from the tile that was actually pressed. Clicks are
                    // handled once, by delegation, on the viewport itself — see below.
                    el._funItem = item;

                    if (item.type === 'image') {
                        el.innerHTML = `<img src="${item.src}" alt="${item.alt || ''}" loading="lazy" decoding="async" class="fun-item-media" draggable="false">`;
                    } else if (item.type === 'video') {
                        el.innerHTML = `<video class="fun-item-media" loop muted playsinline preload="metadata" poster="${item.poster || ''}"><source src="${item.src}" type="video/mp4"></video>`;
                        const videoEl = el.querySelector('video');
                        el.addEventListener('mouseenter', () => videoEl?.play().catch(() => {}));
                        el.addEventListener('mouseleave', () => { videoEl?.pause(); if (videoEl) videoEl.currentTime = 0; });
                    } else if (item.type === 'poster') {
                        el.innerHTML = `<div class="fun-item-poster" style="background:${item.bg || '#111'};"><span class="fun-item-poster-text" style="color:${item.color || '#fff'};">${item.text || ''}</span></div>`;
                    }

                    // Caption shown after ~1s of the cursor sitting still on a piece
                    if (item.caption) {
                        const caption = document.createElement('div');
                        caption.className = 'fun-item-caption';
                        caption.textContent = item.caption;
                        el.appendChild(caption);

                        let hoverTimer = null;
                        el.addEventListener('mouseenter', () => {
                            hoverTimer = setTimeout(() => caption.classList.add('is-visible'), 1000);
                        });
                        el.addEventListener('mouseleave', () => {
                            clearTimeout(hoverTimer);
                            caption.classList.remove('is-visible');
                        });
                    }

                    return el;
                };

                // [NEW] Delegated click handling for the canvas (see the _funItem comment above
                // for why per-tile click listeners were unreliable here). Handles opening the
                // lightbox/video modal and the 5-rapid-clicks easter egg for whichever tile the
                // click actually landed on.
                const tileClickCounts = new WeakMap();
                viewport.addEventListener('click', (e) => {
                    if (draggedDistance > 6) return; // ignore click after a drag gesture
                    // Use elementFromPoint instead of e.target: once viewport.setPointerCapture()
                    // is active during pointerdown, some browsers report e.target on the
                    // resulting click as the capturing element itself rather than the tile that
                    // was actually under the cursor, so closest('.fun-item') never matches.
                    const hit = document.elementFromPoint(e.clientX, e.clientY);
                    const tile = hit?.closest('.fun-item');
                    if (!tile || !tile._funItem) return;
                    const item = tile._funItem;

                    if (item.type === 'image') {
                        if (lightboxImg && lightboxModal) {
                            lightboxImg.src = item.src;
                            lightboxModal.classList.add('active');
                        }
                    } else if (item.type === 'video') {
                        if (modalVideo && videoModal) {
                            modalVideo.src = item.src;
                            videoModal.classList.add('active');
                            modalVideo.play();
                            document.body.style.overflow = 'hidden';
                        }
                    }

                    const state = tileClickCounts.get(tile) || { count: 0, timer: null };
                    state.count++;
                    clearTimeout(state.timer);
                    state.timer = setTimeout(() => { state.count = 0; }, 1200);
                    tileClickCounts.set(tile, state);

                    if (state.count >= 5) {
                        state.count = 0;
                        tile.classList.add('fun-item-egg');
                        tile.addEventListener('animationend', () => tile.classList.remove('fun-item-egg'), { once: true });
                    }
                });

                // --- Pan state ---
                let originX = 0, originY = 0;       // current canvas translate
                let velocityX = 0, velocityY = 0;   // for inertia + blur intensity
                let isPointerDown = false;
                let lastPointerX = 0, lastPointerY = 0;
                let lastMoveTime = 0;
                let draggedDistance = 0;
                let inertiaRAF = null;
                let blurTimeout = null;
                let renderTilesRAF = null;

                const applyTransform = () => {
                    canvas.style.transform = `translate3d(${originX}px, ${originY}px, 0)`;
                };

                // renderVisibleTiles() builds/removes DOM tiles and is expensive, so during a drag
                // it's throttled to once per animation frame instead of running on every pointermove
                // (which can fire far faster than 60fps and was causing the drag to feel laggy).
                const scheduleRenderVisibleTiles = () => {
                    if (renderTilesRAF) return;
                    renderTilesRAF = requestAnimationFrame(() => {
                        renderTilesRAF = null;
                        renderVisibleTiles();
                    });
                };

                const renderVisibleTiles = () => {
                    if (!sourceItems.length) return;

                    const vw = viewport.clientWidth;
                    const vh = viewport.clientHeight;

                    const firstCol = Math.floor(-originX / STEP_W) - BUFFER;
                    const lastCol = Math.floor((-originX + vw) / STEP_W) + BUFFER;
                    const firstRow = Math.floor(-originY / STEP_H) - BUFFER;
                    const lastRow = Math.floor((-originY + vh) / STEP_H) + BUFFER;

                    const neededKeys = new Set();

                    for (let row = firstRow; row <= lastRow; row++) {
                        for (let col = firstCol; col <= lastCol; col++) {
                            const key = `${col},${row}`;
                            neededKeys.add(key);
                            if (!cellEls.has(key)) {
                                const item = pickItemForCell(col, row);
                                const tile = buildTile(item, col, row);
                                canvas.appendChild(tile);
                                cellEls.set(key, tile);
                            }
                        }
                    }

                    // Remove tiles that scrolled far out of view to keep the DOM light
                    cellEls.forEach((el, key) => {
                        if (!neededKeys.has(key)) {
                            el.remove();
                            cellEls.delete(key);
                        }
                    });
                };

                const setBlur = (on) => {
                    canvas.classList.toggle('is-blurred', on);
                };

                // --- Drag SFX (synthesized via Web Audio, no external file needed) ---
                let audioCtx = null;
                let whooshOsc = null;
                let whooshGain = null;
                let lastWhooshUpdate = 0;

                const ensureAudioCtx = () => {
                    if (!audioCtx) {
                        const Ctx = window.AudioContext || window.webkitAudioContext;
                        if (Ctx) audioCtx = new Ctx();
                    }
                    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                    return audioCtx;
                };

                let whooshNoiseSource = null;
                let whooshNoiseFilter = null;
                let whooshNoiseGain = null;

                // Builds a looping buffer of white noise, once, reused for every drag
                let noiseBuffer = null;
                const getNoiseBuffer = (ctx) => {
                    if (noiseBuffer) return noiseBuffer;
                    const bufferSize = ctx.sampleRate * 2;
                    noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                    const data = noiseBuffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                    return noiseBuffer;
                };

                const startWhoosh = () => {
                    const ctx = ensureAudioCtx();
                    if (!ctx || whooshOsc) return;

                    // Low sine layer: carries almost all the weight/boom
                    whooshOsc = ctx.createOscillator();
                    whooshGain = ctx.createGain();
                    whooshOsc.type = 'sine';
                    whooshOsc.frequency.setValueAtTime(55, ctx.currentTime);
                    whooshGain.gain.setValueAtTime(0, ctx.currentTime);
                    whooshOsc.connect(whooshGain);
                    whooshGain.connect(ctx.destination);
                    whooshOsc.start();

                    // Filtered noise layer: barely-there texture underneath the boom, not the focus
                    whooshNoiseSource = ctx.createBufferSource();
                    whooshNoiseSource.buffer = getNoiseBuffer(ctx);
                    whooshNoiseSource.loop = true;
                    whooshNoiseFilter = ctx.createBiquadFilter();
                    whooshNoiseFilter.type = 'lowpass';
                    whooshNoiseFilter.frequency.setValueAtTime(120, ctx.currentTime);
                    whooshNoiseFilter.Q.setValueAtTime(0.5, ctx.currentTime);
                    whooshNoiseGain = ctx.createGain();
                    whooshNoiseGain.gain.setValueAtTime(0, ctx.currentTime);
                    whooshNoiseSource.connect(whooshNoiseFilter);
                    whooshNoiseFilter.connect(whooshNoiseGain);
                    whooshNoiseGain.connect(ctx.destination);
                    whooshNoiseSource.start();
                };

                // Continuously nudges pitch/volume of the whoosh to track drag speed. Boomy sine leads, noise stays subtle
                const updateWhoosh = (speed) => {
                    const ctx = audioCtx;
                    if (!ctx || !whooshOsc || !whooshGain) return;
                    const now = performance.now();
                    if (now - lastWhooshUpdate < 40) return; // throttle to ~25fps of audio updates
                    lastWhooshUpdate = now;

                    const clamped = Math.min(speed, 120);
                    const ratio = clamped / 120;

                    const targetFreq = 50 + clamped * 0.5;
                    const targetGain = 0.16 + ratio * 0.9; // audible floor + scales up hard with speed
                    whooshOsc.frequency.setTargetAtTime(targetFreq, ctx.currentTime, 0.05);
                    whooshGain.gain.setTargetAtTime(targetGain, ctx.currentTime, 0.05);

                    if (whooshNoiseFilter && whooshNoiseGain) {
                        const targetNoiseFreq = 100 + ratio * 200;
                        const targetNoiseGain = 0.04 + ratio * 0.15;
                        whooshNoiseFilter.frequency.setTargetAtTime(targetNoiseFreq, ctx.currentTime, 0.05);
                        whooshNoiseGain.gain.setTargetAtTime(targetNoiseGain, ctx.currentTime, 0.05);
                    }
                };

                const stopWhoosh = () => {
                    if (!whooshOsc || !audioCtx) return;
                    const ctx = audioCtx;
                    const fadeOutTime = 0.25;

                    // Cancel any in-flight ramps first so the fade-out starts from the actual current value
                    whooshGain.gain.cancelScheduledValues(ctx.currentTime);
                    whooshGain.gain.setValueAtTime(whooshGain.gain.value, ctx.currentTime);
                    whooshGain.gain.linearRampToValueAtTime(0, ctx.currentTime + fadeOutTime);

                    if (whooshNoiseGain) {
                        whooshNoiseGain.gain.cancelScheduledValues(ctx.currentTime);
                        whooshNoiseGain.gain.setValueAtTime(whooshNoiseGain.gain.value, ctx.currentTime);
                        whooshNoiseGain.gain.linearRampToValueAtTime(0, ctx.currentTime + fadeOutTime);
                    }

                    const oscToStop = whooshOsc;
                    const noiseToStop = whooshNoiseSource;
                    // Stop strictly after the ramp has fully reached 0: no truncated waveform, no click
                    setTimeout(() => {
                        try { oscToStop.stop(); } catch (err) {}
                        try { noiseToStop?.stop(); } catch (err) {}
                    }, fadeOutTime * 1000 + 30);

                    whooshOsc = null;
                    whooshGain = null;
                    whooshNoiseSource = null;
                    whooshNoiseFilter = null;
                    whooshNoiseGain = null;
                };

                const stopInertia = () => {
                    if (inertiaRAF) cancelAnimationFrame(inertiaRAF);
                    inertiaRAF = null;
                };

                const runInertia = () => {
                    stopInertia();
                    const step = () => {
                        velocityX *= 0.92;
                        velocityY *= 0.92;
                        originX += velocityX;
                        originY += velocityY;
                        applyTransform();
                        renderVisibleTiles();

                        if (Math.abs(velocityX) > 0.5 || Math.abs(velocityY) > 0.5) {
                            inertiaRAF = requestAnimationFrame(step);
                        } else {
                            setBlur(false);
                        }
                    };
                    inertiaRAF = requestAnimationFrame(step);
                };

                viewport.addEventListener('pointerdown', (e) => {
                    if (e.button !== undefined && e.button !== 0) return;
                    stopInertia();
                    isPointerDown = true;
                    draggedDistance = 0;
                    lastPointerX = e.clientX;
                    lastPointerY = e.clientY;
                    lastMoveTime = performance.now();
                    viewport.classList.add('is-dragging');
                    viewport.setPointerCapture(e.pointerId);
                    startWhoosh();
                });

                viewport.addEventListener('pointermove', (e) => {
                    if (!isPointerDown) return;

                    const now = performance.now();
                    const dt = Math.max(now - lastMoveTime, 1);
                    const dx = e.clientX - lastPointerX;
                    const dy = e.clientY - lastPointerY;

                    originX += dx;
                    originY += dy;
                    velocityX = dx / dt * 16; // normalize to ~per-frame velocity
                    velocityY = dy / dt * 16;
                    draggedDistance += Math.abs(dx) + Math.abs(dy);

                    lastPointerX = e.clientX;
                    lastPointerY = e.clientY;
                    lastMoveTime = now;

                    applyTransform();
                    scheduleRenderVisibleTiles();

                    // Motion blur kicks in once the drag is moving fast enough
                    const speed = Math.abs(velocityX) + Math.abs(velocityY);
                    setBlur(speed > 18);
                    updateWhoosh(speed);
                    clearTimeout(blurTimeout);
                    blurTimeout = setTimeout(() => setBlur(false), 120);
                });

                const endDrag = (e) => {
                    if (!isPointerDown) return;
                    isPointerDown = false;
                    viewport.classList.remove('is-dragging');
                    if (e && e.pointerId !== undefined) {
                        try { viewport.releasePointerCapture(e.pointerId); } catch (err) {}
                    }
                    stopWhoosh();
                    runInertia();
                };
                viewport.addEventListener('pointerup', endDrag);
                viewport.addEventListener('pointercancel', endDrag);
                viewport.addEventListener('pointerleave', () => { if (isPointerDown) endDrag(); });

                // Prevent native image/text drag ghosting
                viewport.addEventListener('dragstart', (e) => e.preventDefault());

                window.addEventListener('resize', () => {
                    if (window.matchMedia('(min-width: 992px)').matches) renderVisibleTiles();
                });

                fetch('data/fun.json')
                    .then(r => r.json())
                    .then(data => {
                        allItems = Array.isArray(data) ? data : [];
                        applyFilter();
                        renderVisibleTiles();
                    })
                    .catch(err => console.error('Failed to load fun.json for canvas', err));

                // Re-filter and rebuild every currently-mounted tile when the category filter changes
                window.addEventListener('funFilterChange', () => {
                    applyFilter();
                    cellData.clear();
                    cellEls.forEach(el => el.remove());
                    cellEls.clear();
                    renderVisibleTiles();
                });
            });
        </script>
        <script>
            // [NEW] Pinch/scroll/button zoom + drag-to-pan for the Fun page's image lightbox.
            // Independent of the two scripts that can open this same modal (mobile grid, desktop
            // canvas) — it just watches the modal's own state, so it works no matter which one
            // opened it, and resets automatically whenever the modal closes.
            document.addEventListener('DOMContentLoaded', () => {
                const modal = document.getElementById('fun-lightbox-modal');
                const frame = document.getElementById('fun-lightbox-frame');
                const img = document.getElementById('fun-lightbox-img');
                const zoomInBtn = document.getElementById('fun-zoom-in');
                const zoomOutBtn = document.getElementById('fun-zoom-out');
                const zoomResetBtn = document.getElementById('fun-zoom-reset');
                if (!modal || !frame || !img) return;

                const MIN_SCALE = 1;
                const MAX_SCALE = 4;
                let scale = 1;
                let panX = 0;
                let panY = 0;

                const applyZoomTransform = () => {
                    img.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
                    frame.classList.toggle('is-zoomed', scale > 1);
                    if (zoomResetBtn) zoomResetBtn.textContent = `${Math.round(scale * 100)}%`;
                };

                const clampPan = () => {
                    // Keep the image from being dragged so far it leaves visible content behind
                    const frameRect = frame.getBoundingClientRect();
                    const maxX = (frameRect.width * (scale - 1)) / 2;
                    const maxY = (frameRect.height * (scale - 1)) / 2;
                    panX = Math.max(-maxX, Math.min(maxX, panX));
                    panY = Math.max(-maxY, Math.min(maxY, panY));
                };

                const setScale = (next) => {
                    scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, next));
                    if (scale === 1) { panX = 0; panY = 0; }
                    clampPan();
                    applyZoomTransform();
                };

                const resetZoom = () => { scale = 1; panX = 0; panY = 0; applyZoomTransform(); };

                zoomInBtn?.addEventListener('click', () => setScale(scale + 0.5));
                zoomOutBtn?.addEventListener('click', () => setScale(scale - 0.5));
                zoomResetBtn?.addEventListener('click', resetZoom);

                // Double-click/tap toggles between fit and 2x zoom
                img.addEventListener('dblclick', () => setScale(scale > 1 ? 1 : 2));

                // Scroll wheel to zoom, centered on the cursor position
                frame.addEventListener('wheel', (e) => {
                    if (!modal.classList.contains('active')) return;
                    e.preventDefault();
                    const delta = e.deltaY > 0 ? -0.25 : 0.25;
                    setScale(scale + delta);
                }, { passive: false });

                // Drag to pan once zoomed in
                let isDragging = false;
                let startX = 0, startY = 0, startPanX = 0, startPanY = 0;

                frame.addEventListener('pointerdown', (e) => {
                    if (scale <= 1) return;
                    isDragging = true;
                    frame.classList.add('is-dragging');
                    startX = e.clientX;
                    startY = e.clientY;
                    startPanX = panX;
                    startPanY = panY;
                    frame.setPointerCapture(e.pointerId);
                });
                frame.addEventListener('pointermove', (e) => {
                    if (!isDragging) return;
                    panX = startPanX + (e.clientX - startX);
                    panY = startPanY + (e.clientY - startY);
                    clampPan();
                    applyZoomTransform();
                });
                const endDrag = (e) => {
                    if (!isDragging) return;
                    isDragging = false;
                    frame.classList.remove('is-dragging');
                    if (e?.pointerId !== undefined) {
                        try { frame.releasePointerCapture(e.pointerId); } catch (err) {}
                    }
                };
                frame.addEventListener('pointerup', endDrag);
                frame.addEventListener('pointercancel', endDrag);

                // Reset zoom whenever the modal is closed, from any trigger
                new MutationObserver(() => {
                    if (!modal.classList.contains('active')) resetZoom();
                }).observe(modal, { attributes: true, attributeFilter: ['class'] });
            });
        </script>
    </body>
</html>
