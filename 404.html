    <!-- Snake Game Logic -->
    <script>
        // Sound Effect Generator
        let audioCtx = null;

        function getAudio() {
            if (audioCtx) return audioCtx;
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return null;
            audioCtx = new AC();
            return audioCtx;
        }

        // Eat: short snappy "pop", sine up-sweep
        function playEatSound() {
            const ac = getAudio();
            if (!ac) return;
            const t = ac.currentTime;
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.connect(gain); gain.connect(ac.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, t);
            osc.frequency.exponentialRampToValueAtTime(900, t + 0.08);
            gain.gain.setValueAtTime(0.4, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
            osc.start(t); osc.stop(t + 0.12);
        }

        // Level Up: happy 4-note arpeggio
        function playLevelUpSound() {
            const ac = getAudio();
            if (!ac) return;
            const t = ac.currentTime;
            [392, 523, 659, 784].forEach((freq, i) => {
                const osc = ac.createOscillator();
                const gain = ac.createGain();
                osc.connect(gain); gain.connect(ac.destination);
                osc.type = 'square';
                osc.frequency.value = freq;
                const s = t + i * 0.08;
                gain.gain.setValueAtTime(0.18, s);
                gain.gain.exponentialRampToValueAtTime(0.001, s + 0.15);
                osc.start(s); osc.stop(s + 0.18);
            });
        }

        // Game Over: 3-note sad descending tone + low rumble noise
        function playGameOverSound() {
            const ac = getAudio();
            if (!ac) return;
            const t = ac.currentTime;

            // Descending sad notes
            [330, 262, 196].forEach((freq, i) => {
                const osc = ac.createOscillator();
                const gain = ac.createGain();
                osc.connect(gain); gain.connect(ac.destination);
                osc.type = 'sawtooth';
                osc.frequency.value = freq;
                const s = t + i * 0.18;
                gain.gain.setValueAtTime(0.25, s);
                gain.gain.exponentialRampToValueAtTime(0.001, s + 0.3);
                osc.start(s); osc.stop(s + 0.35);
            });

            // Low rumble using noise buffer
            const bufSize = ac.sampleRate * 0.5;
            const buf = ac.createBuffer(1, bufSize, ac.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = ac.createBufferSource();
            noise.buffer = buf;
            const noiseFilter = ac.createBiquadFilter();
            noiseFilter.type = 'lowpass';
            noiseFilter.frequency.value = 80;
            const noiseGain = ac.createGain();
            noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(ac.destination);
            noiseGain.gain.setValueAtTime(0.4, t);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
            noise.start(t); noise.stop(t + 0.55);
        }

        // Start: quick upbeat 2-note bleep
        function playStartSound() {
            const ac = getAudio();
            if (!ac) return;
            const t = ac.currentTime;
            [440, 660].forEach((freq, i) => {
                const osc = ac.createOscillator();
                const gain = ac.createGain();
                osc.connect(gain); gain.connect(ac.destination);
                osc.type = 'sine';
                osc.frequency.value = freq;
                const s = t + i * 0.1;
                gain.gain.setValueAtTime(0.25, s);
                gain.gain.exponentialRampToValueAtTime(0.001, s + 0.12);
                osc.start(s); osc.stop(s + 0.15);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('game-canvas');
            const startBtn = document.getElementById('start-game-btn');
            const restartBtn = document.getElementById('restart-game-btn');
            const closeBtn = document.getElementById('close-game-btn');
            const scoreEl = document.getElementById('game-score');
            const highScoreEl = document.getElementById('high-score');
            const headerEl = document.getElementById('game-header');
            const gameControls = document.getElementById('game-controls');
            const gameContainer = document.getElementById('snake-game-container');
            const gameBackdrop = document.getElementById('snake-game-backdrop');

            if (!canvas || !startBtn || !scoreEl) return;

            const ctx = canvas.getContext('2d');
            
            // Game Config
            const internalSize = 400; 
            canvas.width = internalSize;
            canvas.height = internalSize;
            
            const gridSize = 20; 
            const tileCount = internalSize / gridSize; 
            
            // Array Warna Level-Up (Warna premium/pastel ala Apple)
            const levelColors = [
                "#f5f5f7", // Level 0 (0-4): Apple Light Gray
                "#f0f4ff", // Level 1 (5-9): Soft Apple Blue
                "#eef8f0", // Level 2 (10-14): Soft Apple Green
                "#fff2f0", // Level 3 (15-19): Soft Peach
                "#f4f0ff", // Level 4 (20-24): Lavender
                "#ffe8e8"  // Level 5 (25+): Light Danger Red
            ];
            
            let score = 0;
            let highScore = localStorage.getItem('snake_high_score') || 0;
            let velocityX = 0;
            let velocityY = 0;
            let playerX = 10;
            let playerY = 10;
            let trail = [];
            let tail = 5;
            let appleX = 15;
            let appleY = 15;
            let particles = []; // Array untuk menyimpan partikel confetti
            let gameInterval;
            let isGameRunning = false;
            let isPaused = false;

            // Initialize High Score Display & Score Wrapper
            if (highScoreEl) highScoreEl.innerText = highScore;
            if(headerEl) headerEl.style.display = "none";
            if(gameControls) gameControls.style.display = "none";

            // Prevent stacking listeners
            window.removeEventListener('keydown', keyPush);
            window.addEventListener('keydown', keyPush);

            startBtn.addEventListener('click', () => {
                getAudio(); // warm up audio context on user gesture
                startGame();
            });

            if (restartBtn) {
                restartBtn.addEventListener('click', () => {
                    getAudio();
                    startGame();
                });
            }


            // On-screen control listeners
            if(gameControls) {
                gameControls.querySelectorAll('.game-control-btn').forEach(button => {
                    button.addEventListener('click', (e) => {
                        const direction = e.target.dataset.direction;
                        handleDirectionInput(direction);
                    });
                });
            }

            function startGame() {
                if (isGameRunning) return;
                isGameRunning = true;
                score = 0;
                isPaused = false;
                scoreEl.innerText = score;
                if(gameContainer) gameContainer.style.display = "flex"; // Reveal the collapsed game card now that Play was pressed
                if(gameBackdrop) gameBackdrop.style.display = "block";
                if(headerEl) headerEl.style.display = "flex";
                if(gameControls) gameControls.style.display = "block"; // Show controls on game start
                if(restartBtn) restartBtn.style.display = "none";

                // Reset Animasi dan Warna Layar
                canvas.classList.remove('shake-animation');
                canvas.style.backgroundColor = levelColors[0];
                canvas.style.display = "block";
                startBtn.style.display = "none";

                playStartSound();
                
                playerX = 10;
                playerY = 10;
                velocityX = 0;
                velocityY = 0;
                trail = [];
                tail = 5;
                particles = []; // Reset partikel saat mulai ulang
                
                placeApple();
                if (gameInterval) clearInterval(gameInterval);
                gameInterval = setInterval(gameLoop, 1000/15); 
            }

            function gameLoop() {
                if (isPaused) return;

                playerX += velocityX;
                playerY += velocityY;

                if (playerX < 0) playerX = tileCount - 1;
                if (playerX > tileCount - 1) playerX = 0;
                if (playerY < 0) playerY = tileCount - 1;
                if (playerY > tileCount - 1) playerY = 0;

                // Hapus isi canvas (Background di-handle oleh CSS agar transisinya bisa di-animate)
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // DRAW GRID
                ctx.strokeStyle = "rgba(0,0,0,0.03)";
                ctx.lineWidth = 1;
                for(let i=0; i<=tileCount; i++) {
                    ctx.beginPath(); ctx.moveTo(i*gridSize, 0); ctx.lineTo(i*gridSize, canvas.height); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(0, i*gridSize); ctx.lineTo(canvas.width, i*gridSize); ctx.stroke();
                }

                // DRAW CONFETTI PARTICLES
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.8; // Efek gravitasi menarik ke bawah
                    p.life -= 0.06; // Kecepatan memudar

                    if (p.life <= 0) {
                        particles.splice(i, 1); // Hapus partikel yang sudah mati
                    } else {
                        ctx.globalAlpha = p.life;
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.globalAlpha = 1.0; // Kembalikan alpha normal untuk elemen lain
                    }
                }

                // CHECK COLLISION
                for (let i = 0; i < trail.length; i++) {
                    if (trail[i].x === playerX && trail[i].y === playerY && (velocityX !== 0 || velocityY !== 0)) {
                        gameOver();
                        return;
                    }
                }

                // UPDATE TRAIL
                trail.push({ x: playerX, y: playerY });
                while (trail.length > tail) {
                    trail.shift();
                }

                // DRAW APPLE (Glowing Circle)
                const ax = appleX * gridSize + gridSize / 2;
                const ay = appleY * gridSize + gridSize / 2;
                ctx.shadowBlur = 12;
                ctx.shadowColor = "rgba(255, 59, 48, 0.4)";
                ctx.fillStyle = "#ff3b30";
                ctx.beginPath();
                ctx.arc(ax, ay, gridSize / 2 - 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                // DRAW SNAKE
                for (let i = 0; i < trail.length; i++) {
                    const isHead = i === trail.length - 1;
                    const tx = trail[i].x * gridSize;
                    const ty = trail[i].y * gridSize;

                    ctx.fillStyle = isHead ? "#111" : "#555";
                    
                    // Rounded Body
                    ctx.beginPath();
                    if(ctx.roundRect) {
                        ctx.roundRect(tx + 1, ty + 1, gridSize - 2, gridSize - 2, 6);
                    } else {
                        ctx.fillRect(tx + 1, ty + 1, gridSize - 2, gridSize - 2);
                    }
                    ctx.fill();

                    // Cute Eyes for the Head
                    if (isHead) {
                        ctx.fillStyle = "#fff";
                        let ex1, ey1, ex2, ey2;
                        if (velocityX === 1) { ex1=tx+14; ey1=ty+6; ex2=tx+14; ey2=ty+14; }
                        else if (velocityX === -1) { ex1=tx+6; ey1=ty+6; ex2=tx+6; ey2=ty+14; }
                        else if (velocityY === 1) { ex1=tx+6; ey1=ty+14; ex2=tx+14; ey2=ty+14; }
                        else if (velocityY === -1) { ex1=tx+6; ey1=ty+6; ex2=tx+14; ey2=ty+6; }
                        else { ex1=tx+14; ey1=ty+6; ex2=tx+14; ey2=ty+14; } // Default Right
                        
                        ctx.beginPath(); ctx.arc(ex1, ey1, 2, 0, Math.PI * 2); ctx.fill();
                        ctx.beginPath(); ctx.arc(ex2, ey2, 2, 0, Math.PI * 2); ctx.fill();
                    }
                }

                if (appleX === playerX && appleY === playerY) {
                    tail++;
                    score++;
                    scoreEl.innerText = score;
                    playEatSound();

                    // Spawn Confetti Particles
                    for (let i = 0; i < 20; i++) {
                        particles.push({
                            x: appleX * gridSize + gridSize / 2,
                            y: appleY * gridSize + gridSize / 2,
                            vx: (Math.random() - 0.5) * 16, // Lontaran acak horizontal
                            vy: (Math.random() - 0.5) * 16 - 4, // Lontaran acak vertikal (cenderung ke atas)
                            life: 1.0,
                            color: ["#ff3b30", "#34c759", "#ff9500", "#5ac8fa", "#007aff"][Math.floor(Math.random() * 5)], // Apple System Colors
                            size: Math.random() * 3 + 1.5
                        });
                    }

                    // Level Up System - Ubah warna background tiap kelipatan 5
                    if (score % 5 === 0) {
                        const level = Math.floor(score / 5);
                        const newColor = levelColors[Math.min(level, levelColors.length - 1)];
                        canvas.style.backgroundColor = newColor;
                        playLevelUpSound();
                    }

                    // Increase Speed (Difficulty)
                    clearInterval(gameInterval);
                    const newFps = 15 + Math.floor(score / 2);
                    gameInterval = setInterval(gameLoop, 1000/newFps);
                    
                    // Update High Score
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem('snake_high_score', highScore);
                        if (highScoreEl) highScoreEl.innerText = highScore;
                    }
                    placeApple();
                }
            }

            function placeApple() {
                appleX = Math.floor(Math.random() * tileCount);
                appleY = Math.floor(Math.random() * tileCount);
                // Simple check to avoid spawning on snake
                for(let t of trail) {
                    if(t.x === appleX && t.y === appleY) {
                        placeApple();
                        break;
                    }
                }
            }




            function handleDirectionInput(direction) {
                if (!isGameRunning || isPaused) return;

                switch (direction) {
                    case 'left': if (velocityX !== 1) { velocityX = -1; velocityY = 0; } break;
                    case 'up': if (velocityY !== 1) { velocityX = 0; velocityY = -1; } break;
                    case 'right': if (velocityX !== -1) { velocityX = 1; velocityY = 0; } break;
                    case 'down': if (velocityY !== -1) { velocityX = 0; velocityY = 1; } break;
                }
            }

            function keyPush(evt) {
                if([32, 37, 38, 39, 40].indexOf(evt.keyCode) > -1) {
                    evt.preventDefault();
                }

                if (!isGameRunning) return;

                if (evt.keyCode === 32) { // Spacebar
                    isPaused = !isPaused;
                    if (isPaused) {
                        ctx.fillStyle = "rgba(245, 245, 247, 0.85)";
                        ctx.fillRect(0, 0, canvas.width, canvas.height);

                        ctx.fillStyle = "#4a4a4a"; // Darker color for better contrast
                        ctx.font = "800 32px var(--font-primary, sans-serif)";
                        ctx.textAlign = "center";
                        ctx.fillText("PAUSED", canvas.width/2, canvas.height/2 + 10);
                    }
                    return;
                }

                if (isPaused) return;

                switch (evt.keyCode) {




                    case 37: handleDirectionInput('left'); break;
                    case 38: handleDirectionInput('up'); break;
                    case 39: handleDirectionInput('right'); break;
                    case 40: handleDirectionInput('down'); break;
                }
            }


            // Touch Controls (integrated with handleDirectionInput)
            let touchStartX = 0, touchStartY = 0;
            canvas.addEventListener('touchstart', e => {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
                e.preventDefault();
            }, {passive: false});

            canvas.addEventListener('touchend', e => {
                if (!isGameRunning) return;
                let dx = e.changedTouches[0].screenX - touchStartX;
                let dy = e.changedTouches[0].screenY - touchStartY;
                if (Math.abs(dx) > Math.abs(dy)) {


                    if (dx > 0) { handleDirectionInput('right'); }
                    else if (dx < 0) { handleDirectionInput('left'); }
                } else {


                    if (dy > 0) { handleDirectionInput('down'); }
                    else if (dy < 0) { handleDirectionInput('up'); }
                }
                e.preventDefault();
            }, {passive: false});

            function gameOver() {
                if (!isGameRunning) return; // Prevent multiple calls
                isGameRunning = false;
                if (gameInterval) clearInterval(gameInterval);

                try {
                    playGameOverSound();
                } catch (e) {
                    console.warn('Failed to play game over sound:', e);
                }

                // Tambahkan efek gempa di layar
                canvas.classList.add('shake-animation');

                // Tunda tombol muncul sampai animasi bergetar selesai (600ms)
                setTimeout(() => {
                    if(restartBtn) restartBtn.style.display = "block"; // Restart lives inside the overlay itself, not behind the backdrop
                    if(gameControls) gameControls.style.display = "none"; // Hide controls on game over
                    if(headerEl) headerEl.style.display = "none"; // Hide score on game over
                }, 600);
            }

            // Closes the overlay and returns to the plain 404 page — via the ✕ button or by
            // clicking the blurred backdrop itself.
            function closeGame() {
                isGameRunning = false;
                isPaused = false;
                if (gameInterval) clearInterval(gameInterval);
                if (gameContainer) gameContainer.style.display = "none";
                if (gameBackdrop) gameBackdrop.style.display = "none";
                startBtn.style.display = "block"; // startGame() hides this when the overlay opens — restore it so there's a way back into the game after closing
            }
            if (closeBtn) closeBtn.addEventListener('click', closeGame);
            if (gameBackdrop) gameBackdrop.addEventListener('click', closeGame);

        });
    </script>
    <style>
        /* Retro handheld D-pad buttons — dark "keycap" squares with a chunky drop-shadow
           edge, matching the console-shell styling on #snake-game-container/#start-game-btn
           in css/style.css. Sharp corners (no border-radius) to match the site's editorial
           art direction, and grayscale rather than a colored LCD-style accent. */
        .game-control-btn {
            background-color: #000; /* Same bezel/black tone as the screen border, like buttons molded into the shell */
            color: #fff;
            border: none;
            border-radius: 0;
            padding: 0;
            margin: 4px;
            font-size: 1.1em;
            cursor: pointer;
            outline: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            width: 48px;
            height: 48px;
            min-width: 48px;
            min-height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 0 #444; /* Physical "keycap" edge, matching #start-game-btn */
        }

        .game-control-btn:hover {
            background-color: #333;
        }
        .game-control-btn:active {
            transform: translateY(3px);
            box-shadow: 0 0 0 #444;
        }
    </style>
